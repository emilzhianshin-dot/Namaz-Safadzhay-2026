name: Build Namaz Vakytylary 1.2-test2
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check files and original prayer times BEFORE build
        run: python3 scripts/preflight.py
      - name: Compile, unit-test, lint and build stable APK
        run: gradle --no-daemon --console=plain :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify stable package and certificate
        run: bash scripts/verify-apk.sh
      - name: Name APK clearly
        run: cp app/build/outputs/apk/release/app-release.apk Namaz_Vakytylary_1.2-test2.apk
      - name: Upload stable APK
        uses: actions/upload-artifact@v5
        with:
          name: Namaz-Vakytylary-1.2-test2
          path: Namaz_Vakytylary_1.2-test2.apk
          if-no-files-found: error
      - name: Upload checks
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            app/build/reports/
            apk-badging.txt
            apk-signing.txt
          if-no-files-found: ignore
